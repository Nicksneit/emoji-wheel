<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Emoji Wheel</title>
<style>
  :root {
    color-scheme: dark;
    --page: #14122a;
    --card: #1f1c3a;
    --field: #15122b;
    --line: #37335c;
    --ink: #f3efe7;
    --muted: #a5a2c6;
    --accent: #f2b84b;
    --accent-ink: #1a1530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.55 system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 20px 72px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .brand img { border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  h1 { font-size: 26px; margin: 0; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  [hidden] { display: none !important; }
  .general { display: flex; gap: 14px 28px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .trigger { margin-bottom: 14px; }
  .trigger h2 { font-size: 15px; margin: 0 0 12px; }
  .trigger .row { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-bottom: 12px; }
  .warnings { list-style: none; padding: 0; margin: 10px 0 0; }
  .warnings li { position: relative; padding-left: 22px; margin: 5px 0; font-size: 13px; color: #ffd479; }
  .warnings li::before { content: "⚠"; position: absolute; left: 0; }
  .field { display: flex; gap: 10px; align-items: center; }
  .field label { font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .note { margin: 0 0 14px; }
  select, input, textarea {
    font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 1px;
  }
  #sectors { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  .sector h2 { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 0 0 10px; }
  .arrow {
    display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
    border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700;
  }
  .sector .fields { display: grid; grid-template-columns: 70px 1fr; gap: 8px 12px; align-items: center; }
  .sector input.icon { width: 70px; text-align: center; font-size: 20px; }
  .sector input.name { width: 100%; }
  .sub { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .sub .count { font-weight: 400; }
  .sub .count.over { color: #ff8a8a; }
  .sector textarea { width: 100%; font-size: 20px; line-height: 1.5; resize: vertical; }
  .sector textarea.main { min-height: 84px; }
  .sector textarea.more { min-height: 120px; }
  .recent-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
  .recent-box p { margin: 0; color: var(--muted); font-size: 13px; }
  .recent-box button { padding: 6px 12px; font-size: 13px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
  button {
    font: inherit; font-weight: 600; border: 1px solid transparent; border-radius: 10px; padding: 9px 18px;
    cursor: pointer; background: var(--accent); color: var(--accent-ink);
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.ghost:hover { background: var(--card); filter: none; }
  input[type=range] { accent-color: var(--accent); padding: 0; width: 150px; }
  output { min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--muted); }
  .spacer { flex: 1; }
  #status { color: var(--muted); min-height: 1.5em; }
  @media (max-width: 520px) { #sectors { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header class="brand"><img src="icons/icon128.png" width="56" height="56" alt=""><h1>Emoji Wheel</h1></header>
  <p class="lead" data-i18n="lead"></p>

  <div class="card general">
    <div class="field">
      <label for="lang" data-i18n="langLabel"></label>
      <select id="lang"></select>
    </div>
    <div class="field">
      <label for="scale" data-i18n="sizeLabel"></label>
      <input id="scale" type="range" min="70" max="120" step="5" value="100">
      <output id="scaleOut" for="scale">100%</output>
    </div>
  </div>

  <div class="card trigger">
    <h2 data-i18n="triggerLabel"></h2>
    <div class="row">
      <div class="field">
        <label for="mode" data-i18n="modeLabel"></label>
        <select id="mode">
          <option value="click" data-i18n="modeClick"></option>
          <option value="hold" data-i18n="modeHold"></option>
        </select>
      </div>
      <div class="field">
        <label for="preset" data-i18n="presetLabel"></label>
        <select id="preset"></select>
      </div>
    </div>
    <div id="customClick" class="row" hidden>
      <div class="field"><label for="first" data-i18n="firstLabel"></label><select id="first"></select></div>
      <div class="field"><label for="second" data-i18n="secondLabel"></label><select id="second"></select></div>
    </div>
    <div id="customHold" class="row" hidden>
      <div class="field"><label for="hold" data-i18n="holdBtnLabel"></label><select id="hold"></select></div>
      <div class="field"><label for="activator" data-i18n="activatorLabel"></label><select id="activator"></select></div>
    </div>
    <div id="moreRow" class="row">
      <div class="field"><label for="moreOn" data-i18n="moreOpenLabel"></label><select id="moreOn"></select></div>
    </div>
    <p id="clickHelp" class="hint"></p>
    <ul id="warnings" class="warnings" aria-live="polite"></ul>
  </div>

  <p class="hint note" data-i18n="sectorHint"></p>
  <div id="sectors"></div>

  <div class="actions">
    <button id="save" type="button" data-i18n="save"></button>
    <button id="export" type="button" class="ghost" data-i18n="exportBtn"></button>
    <button id="import" type="button" class="ghost" data-i18n="importBtn"></button>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <span class="spacer"></span>
    <button id="reset" type="button" class="ghost" data-i18n="reset"></button>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="i18n.js"></script>
<script src="defaults.js"></script>
<script src="options.js"></script>
</body>
</html>
